var QUESTIONS = [
/* --- Emotional Connection --- */
{q:"When something really good happens in your day, what do you do?",o:["They are one of the first people I want to tell, and I know they would genuinely care.","I usually tell them, though sometimes it takes me a while to bring it up.","I think about telling them but often end up keeping it to myself.","It honestly does not cross my mind to share it with them."]},

{q:"Who usually starts the conversation?",o:["It's pretty balanced \u2014 they reach out just as often as I do.","I start slightly more often, but they pick it up warmly.","I start most conversations; they mostly respond.","It's almost entirely on me, and sometimes even that gets silence."]},
{q:"When you make plans together, how does it usually go?",o:["They make real plans and follow through.","We talk about meeting up, but it rarely gets specific.","I'm usually the one trying to make it happen.","Plans happen spontaneously, often at the last minute."]},
{q:"How much effort do they put into seeing you in person?",o:["They carve out time for me even when life gets busy.","We see each other when it's convenient for both of us.","Meetups mostly happen on their terms and their schedule.","Seeing each other in person barely happens, despite all the texting."]},
{q:"When plans fall through, what happens next?",o:["They immediately suggest another time that works.","We say we'll reschedule, and it happens \u2014 eventually.","Rescheduling is usually up to me, or it quietly dies.","Cancelled plans just disappear; nobody mentions them again."]},

{q:"How do they respond when you're excited about something they don't care about?",o:["They still engage \u2014 they like seeing me light up.","They humor me for a bit before changing the subject.","They give short replies until I take the hint.","They ignore it or make me feel silly for caring."]},

{q:"How comfortable would you feel asking \u201cwhere is this going?\u201d",o:["Comfortable \u2014 I trust they'd answer honestly.","Nervous but willing \u2014 I'd probably bring it up eventually.","Very uncomfortable \u2014 I'm afraid of what the answer might be.","I wouldn't dare; it feels like asking could end everything."]},
{q:"How often do you get mixed signals from them?",o:["Rarely \u2014 their words and actions line up.","Sometimes, but I can usually make sense of it.","Often \u2014 I regularly re-read messages looking for clues.","Constantly \u2014 decoding them has become a part-time job."]},

{q:"Is there a romantic charge between you \u2014 flirting, tension, chemistry?",o:["Yes, unmistakably \u2014 it goes well beyond friendship.","There are moments, though neither of us names them.","Rarely \u2014 it mostly feels platonic with occasional hints.","No \u2014 it feels firmly in the friend zone."]},

{q:"When you're together in person, how does the physical closeness feel?",o:["Easy and warm \u2014 lingering hugs, sitting close, genuine affection.","Friendly with the occasional charged moment.","Awkward or carefully distanced, like there's an invisible line.","Strictly platonic \u2014 no different from how they'd act with anyone."]},
{q:"Deep down, what does your gut say about where this could go?",o:["That this could genuinely become something real.","That it could \u2014 but something undefined is holding it back.","That I want it more than they do.","That I've been hoping for something that probably won't happen."]}

var SCORE_MAP = [100, 66, 33, 0];

function api(path, opts){

function localScore(){
  var dims = {}, di, k;
  DIM_KEYS.forEach(function(d,idx){ var s=0; for(k=0;k<6;k++) s+=SCORE_MAP[answers[idx*6+k]]; dims[d]=Math.round(s/6*10)/10; });
  return dims;
}
function localClassify(d){
  if (d.effort <= 40) return "one-sided";
  if (d.emo >= 60 && d.effort <= 55 && d.clarity <= 55) return "emotional-dependence";
  if (d.spark >= 65 && d.effort <= 50 && d.emo <= 55) return "short-term";
  if (d.emo >= 70 && d.effort >= 65 && d.spark >= 60) return "real-feelings";
  if (d.effort >= 60 && d.spark >= 65 && d.emo >= 55) return "potential-real";
  return "gray-zone";
}
function dimNote(label, s){
  if (s >= 75) return label + " looks like a real strength in this connection.";
  if (s >= 55) return label + " shows promise, with room to grow.";
  if (s >= 35) return label + " looks uneven \u2014 worth paying attention to.";
  return label + " looks like the weakest link right now.";
}

var qlock = false;
function vQ(){
  var q = QUESTIONS[qi];

function vLock(err, demo){
  var loadInfo = demo ? Promise.resolve({price:"0.38",currency:"USD"})
    : api("/api/info").then(function(r){ return r.data; }).catch(function(){ return null; });
  show('<h2>Your Relationship Insight Is Ready</h2><p class="sub">Your answers reveal a pattern. Unlock your personalized results to explore what it could mean.</p><div class="card"><p class="note">Loading\u2026</p></div>');
  loadInfo.then(function(inf){
    if (!inf){ show('<h2>Your Relationship Insight Is Ready</h2>'+errBox("Could not load payment options. Please check your connection and try again.")+'<button class="btn" onclick=\'vLock(null,false)\'>Try Again</button>'); return; }
    show('<h2>Your Relationship Insight Is Ready</h2>'+
    '<p class="sub">Your answers reveal a pattern. Unlock your personalized results to explore what it could mean.</p>'+
    '<div class="card" style="text-align:center"><p class="qnum">FULL RESULTS</p><div class="price">Unlock Your Full Results \u2014 $'+esc(inf.price)+' '+esc(inf.currency)+'</div>'+
    '<p class="note">One-time payment. No subscription.</p>'+
    '<button class="btn wine" onclick="pay()">Unlock My Results</button>'+
    '<p class="note" style="margin-top:12px">Secure payment processing by PayPal.</p></div>'+
    errBox(err)+
    (demo?'<div class="demo">DEMO MODE preview. <button class="btn" onclick="demoUnlock()">Preview My Result (demo only \u2014 not the paid report)</button></div>':''));
  });
}
function pay(){
  if (DEMO){ vLock(null, true); return; }
  show('<h2>Creating your secure PayPal order\u2026</h2><div class="card"><p class="note">Please wait. The price is set by our server, never by this page.</p></div>');
  api("/api/payment/create",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sessionId:sessionId,token:sessToken})})
    .then(function(r){
      if (r && r.success){
        pendingOrder = r.data.orderId;
        try{ localStorage.setItem("wawr_order", pendingOrder); }catch(e){}
        pollCapture();
        location.href = r.data.approvalUrl;
      } else vLock((r&&r.message)||"Could not create a PayPal order.", false);
    }).catch(function(){ vLock("Network error. Please try again.", false); });
}
function demoUnlock(){
  var dims = localScore(), type = localClassify(dims), meta = RESULT_META[type];
  result = { type:type, title:meta.title, description:meta.short+" (Demo preview \u2014 the full three-part analysis unlocks after payment in production.)",
    dims:dims, dimLabels:DIM_LABELS, sections:[], demo:true,
    disclaimer:"Your result is based on your answers across four areas: emotional connection, mutual effort, communication clarity, and romantic potential. This quiz is designed for entertainment and self-reflection, not as a scientific assessment or a prediction of another person's feelings." };
  vResult();
}
function pollCapture(){
  show('<h2>Waiting for PayPal\u2026</h2><div class="card"><p class="note">After you approve in PayPal, return here. We verify payment on our server before unlocking. Never mark yourself paid \u2014 only our server can unlock results.</p><div class="bar"><i style="width:60%"></i></div><button class="btn" onclick="checkPayment()">I Approved \u2014 Check Payment</button></div>');
  var n = 0; clearInterval(lockTimer);
  lockTimer = setInterval(function(){ if (++n>90){ clearInterval(lockTimer); } else checkPayment(true); }, 5000);
}
function checkPayment(silent){
  if (!sessionId || !sessToken || !pendingOrder){ if(!silent) vLock("Missing order. Please start payment again.", false); return; }
  api("/api/payment/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sessionId:sessionId,token:sessToken,orderId:pendingOrder})})
    .then(function(r){
      if (r && r.success && !r.locked){ clearInterval(lockTimer); try{localStorage.removeItem("wawr_order");}catch(e){} pendingOrder=null; fetchResults(); }
      else if (!silent){
        var msg = "Payment has not completed yet. If you just paid, wait a moment and try again.";
        if (r && r.code === "ORDER_MISMATCH") msg = "This order does not belong to this test session.";
        else if (r && r.code === "AMOUNT_MISMATCH") msg = "Payment amount does not match. Please contact us.";
        vLock(msg, false);
      }
    }).catch(function(){ if(!silent) vLock("Verification failed. Please try again in a minute.", false); });
}
function fetchResults(){
  api("/api/result?sessionId="+encodeURIComponent(sessionId)+"&token="+encodeURIComponent(sessToken))
    .then(function(r){
      if (r && r.success && !r.locked){ result = r.result; vResult(); }
      else show('<h2>Still locked</h2>'+errBox((r&&r.message)||"Your results are still locked.")+'<button class="btn" onclick=\'vLock(null,false)\'>Back to Unlock</button>');
    }).catch(function(){ show('<h2>Still locked</h2>'+errBox("Network error.")+'<button class="btn" onclick=\'vLock(null,false)\'>Back to Unlock</button>'); });
}

function vResult(){
  var r = result, dims = r.dims;
  var labels = DIM_KEYS.map(function(k){ return r.dimLabels[k]; });
  var vals = DIM_KEYS.map(function(k){ return dims[k]; });
  var dimHtml = DIM_KEYS.map(function(k){
    return '<div><div class="dimrow"><span class="lbl">'+esc(r.dimLabels[k])+'</span><span class="track"><span class="fill" style="display:block;width:'+dims[k]+'%"></span></span><span class="val">'+dims[k]+'</span></div>'+
    '<p class="dimnote">'+esc(dimNote(r.dimLabels[k], dims[k]))+'</p></div>';
  }).join("");
  var secs = (r.sections||[]).map(function(s){ return '<div class="sect"><h3>'+esc(s.title)+'</h3><p>'+esc(s.text)+'</p></div>'; }).join("");
  if (r.demo) secs = '<div class="demo">Demo preview: your type is <b>'+esc(r.title)+'</b>. The full personalized three-part analysis is only served after verified payment in production.</div>';
  show('<p class="res-eyebrow">Your Result</p><h2 class="res-title">'+esc(r.title)+'</h2>'+
    '<p class="res-desc">'+esc(r.description)+'</p>'+
    '<div class="card"><canvas id="radar" height="300"></canvas><div id="radarFallback">'+dimHtml+'</div></div>'+
    '<div class="card"><p class="qnum">YOUR FOUR AREAS</p>'+dimHtml+'</div>'+
    '<div class="card">'+secs+'<p class="note" style="margin-top:16px">'+esc(r.disclaimer)+'</p>'+
    '<p class="note" style="margin-top:8px">Your answers are private. Only the information you choose to share will appear on your public card.</p></div>'+
    '<div class="card" style="text-align:center"><h3>Share your pattern</h3><p class="note">Generate a permanent public card \u2014 screenshot it, send it, post it.</p>'+
    '<button class="btn" onclick="makeShare()">Share My Results</button><div id="shareOut"></div>'+
    (lastShareUrl?'<p class="note" style="margin-top:10px;word-break:break-all">Your existing card still works:<br>'+esc(lastShareUrl)+'</p>':'')+
    (r.demo?'':'<button class="linklike" onclick="revokeShare()">Remove my public card</button>')+'</div>'+
    '<div class="rowbtns"><a class="btn ghost" href="'+CONFIG.discoverUrl+'" target="_blank" rel="noopener">Discover More</a><button class="btn ghost" onclick="retake()">Retake the Test</button></div>');
  try{
    if (window.Chart){ document.getElementById("radarFallback").style.display="none";
      if (chartObj) chartObj.destroy();
      var ctx = document.getElementById("radar");
      /* 高DPI清晰度 */
      var dpr = window.devicePixelRatio||1;
      chartObj = new Chart(ctx, {type:"radar",
        data:{labels:labels,datasets:[{data:vals,backgroundColor:"rgba(217,167,160,.28)",borderColor:"#A97168",borderWidth:2,pointBackgroundColor:"#A97168",pointRadius:3}]},
        options:{responsive:true,devicePixelRatio:dpr,scales:{r:{min:0,max:100,ticks:{stepSize:25,color:"#8A7F76"},grid:{color:"#EBDCD4"},angleLines:{color:"#EBDCD4"},pointLabels:{color:"#35322E",font:{size:11}}}},plugins:{legend:{display:false}}}});
    }
  }catch(e){ /* fallback列表已显示 */ }
}
function makeShare(){
  if (DEMO || result.demo){
    var fakeUrl = location.href.split("?")[0] + "?s=DEMO_" + result.type;
    document.getElementById("shareOut").innerHTML = shareBtns(fakeUrl);
    return;
  }
  api("/api/share",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sessionId:sessionId,token:sessToken})})
    .then(function(r){
      if (r && r.success){ lastShareUrl = r.data.shareUrl; try{localStorage.setItem("wawr_share",lastShareUrl);}catch(e){} document.getElementById("shareOut").innerHTML = shareBtns(lastShareUrl); }
      else document.getElementById("shareOut").innerHTML = errBox((r&&r.message)||"Could not create a share link.");
    }).catch(function(){ document.getElementById("shareOut").innerHTML = errBox("Network error."); });
}
function shareBtns(url){
  return '<p class="note" style="margin-top:10px;word-break:break-all">'+esc(url)+'</p>'+
  '<div class="rowbtns"><button class="btn" onclick="doShare(\''+esc(url)+'\')">Share</button>'+
  '<button class="btn ghost" onclick="copyLink(\''+esc(url)+'\')">Copy Link</button></div><div id="copyMsg" class="note"></div>';
}
function doShare(url){
  var data = {title:"My Peekiva relationship pattern", text:"I discovered my relationship pattern on Peekiva. What\u2019s yours?", url:url};
  if (navigator.share){ navigator.share(data).catch(function(){ var m=document.getElementById("copyMsg"); if(m) m.textContent="Unable to open the share menu. Copy your link instead."; }); }
  else copyLink(url);
}
function copyLink(url){
  var done = function(ok){ var m=document.getElementById("copyMsg"); if(m) m.textContent = ok ? "Link copied! Share it with your friends." : "Unable to open the share menu. Copy your link instead."; };
  if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(function(){done(true);}).catch(function(){ fallbackCopy(url); done(true); }); }
  else { fallbackCopy(url); done(true); }
}
function fallbackCopy(t){ var ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(e){} ta.remove(); }
function revokeShare(){
  var sid = prompt("To remove your public card, paste its share ID (the part after /s/):");
  if (!sid) return;
  api("/api/revoke-share",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sessionId:sessionId,token:sessToken,shareId:sid.trim()})})
    .then(function(){ if (lastShareUrl && lastShareUrl.indexOf(sid.trim())>=0){ lastShareUrl=null; try{localStorage.removeItem("wawr_share");}catch(e){} } alert("If that card belonged to this test, it has been removed."); vResult(); })
    .catch(function(){ alert("Could not reach the server. Please try again."); });
}

function retake(){
  if (confirm("Ready to start over? Your next test is a new assessment and requires another $0.38 payment to unlock the results. Your existing result and share link will remain available.")){
    answers=new Array(24).fill(null); qi=0; sessionId=null; sessToken=null; pendingOrder=null; result=null;
    try{localStorage.removeItem("wawr_progress");localStorage.removeItem("wawr_session");localStorage.removeItem("wawr_token");localStorage.removeItem("wawr_order");}catch(e){}
    /* 注意: wawr_share 故意保留 \u2014 旧分享链接永久有效 */
    if (DEMO){ vQ(); } else startQuizFresh();
  }
}
function startQuizFresh(){
  answers=new Array(24).fill(null); qi=0; saveProgress(); startQuiz();
}

/* ---- public share view (?s=ID) ---- */
function vShareCard(id){
  if (DEMO || !CONFIG.apiBase || CONFIG.apiBase.indexOf("REPLACE")===0){
    var m = /DEMO_([a-z-]+)/.exec(id||"");
    var key = (m && RESULT_META[m[1]]) ? m[1] : "gray-zone";
    showShare(key, {emo:52,effort:48,clarity:44,spark:61}, location.href, true);
    return;
  }
  api("/api/share-card?id="+encodeURIComponent(id)).then(function(r){
    if (r && r.success) showShare(r.data.type, r.data.dims, location.href, false, r.data);
    else show('<h2>Link unavailable</h2><p class="sub">This share link is no longer available. Take the test to create your own result.</p><button class="btn" onclick="goHome()">Take the Test</button><div class="rowbtns"><a class="btn ghost" href="'+CONFIG.discoverUrl+'" target="_blank" rel="noopener">Discover More</a></div>');
  }).catch(function(){ show('<h2>Link unavailable</h2><div class="card"><button class="btn" onclick="goHome()">Take the Test</button></div>'); });
}
function showShare(key, dims, url, demo, data){
  var meta = RESULT_META[key] || RESULT_META["gray-zone"];
  var dimHtml = DIM_KEYS.map(function(k){
    var lbl = (data&&data.dimLabels&&data.dimLabels[k])||DIM_LABELS[k];
    return '<div class="dimrow"><span class="lbl">'+esc(lbl)+'</span><span class="track"><span class="fill" style="display:block;width:'+dims[k]+'%"></span></span><span class="val">'+dims[k]+'</span></div>';
  }).join("");
  show('<div class="card sharecard"><p class="qnum">PEEKIVA \u00b7 WHAT ARE WE, REALLY?</p>'+
  '<p class="sub" style="margin-top:10px">Someone discovered their relationship pattern.</p>'+
  '<div class="big">'+esc(meta.title)+'</div><p class="res-desc">'+esc((data&&data.description)||meta.short)+'</p>'+
  '<div style="text-align:left;margin-top:14px">'+dimHtml+'</div>'+
  (demo?'<div class="demo" style="margin-top:12px">Demo preview card \u2014 not a permanent link.</div>':'')+
  '<button class="btn wine" onclick="goHome()">Take the Test</button>'+
  '<div class="rowbtns"><a class="btn ghost" href="'+CONFIG.discoverUrl+'" target="_blank" rel="noopener">Discover More</a>'+
  '<button class="btn ghost" onclick="doSharePublic(\''+esc(url).replace(/'/g,"")+'\')">Share</button></div><div id="copyMsg" class="note"></div></div>');
}
function doSharePublic(url){
  if (navigator.share){ navigator.share({title:"My Peekiva relationship pattern",text:"Discover your own relationship pattern with Peekiva\u2019s relationship quiz.",url:url}).catch(function(){}); }
  else copyLink(url);
}
function goHome(){
  /* 新访客必须从干净状态开始, 不继承分享者会话 */
  try{ history.replaceState(null,"",location.pathname); }catch(e){}
  try{ localStorage.removeItem("wawr_progress"); localStorage.removeItem("wawr_session"); localStorage.removeItem("wawr_token"); localStorage.removeItem("wawr_order"); }catch(e){}
  answers=new Array(24).fill(null); qi=0; sessionId=null; sessToken=null; pendingOrder=null; result=null;
  vCover(false);
}

/* ---- boot: share link? paypal return? resume? ---- */
(function boot(){
  var qs = new URLSearchParams(location.search);
  var sid = qs.get("s");
  var path = location.pathname.match(/\/s\/([A-Za-z0-9\-_]+)/);
  if (sid || path){ vShareCard(sid || path[1]); return; }
  if (qs.get("paid")==="1" && sessionId && sessToken && pendingOrder && !DEMO){ pollCapture(); checkPayment(); return; }
  try{ history.replaceState(null,"",location.pathname); }catch(e){}
  if (qs.get("cancelled")==="1"){ vLock("Payment was cancelled in PayPal. No charge was made. You can try again when ready.", false); return; }
  if (answers.some(function(a){return a!==null;}) && qi<24 && qi>0){ vCover(true); return; }
  if (qi>=24 && answers.every(function(a){return a!==null;}) && !DEMO && sessionId){ submitAnswers(); return; }
  vCover(answers.some(function(a){return a!==null;}));
})();
</script>
</body>
